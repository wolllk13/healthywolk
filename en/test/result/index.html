<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your report | HealthyWolf</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F4F1EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/lab.css">
<script>document.documentElement.className += " js";</script>
<!-- ANALYTICS -->
</head>
<body data-page="result">
<header class="nav">
  <div class="nav__in">
    <a class="brand" href="/en/" aria-label="HealthyWolf — home">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
        <path d="M9 8 L18 19 L24 15 L30 19 L39 8 L36 23 L32 32 L24 41 L16 32 L12 23 Z"/>
        <path d="M17 24 L21.5 26"/><path d="M31 24 L26.5 26"/><path d="M21 34 L24 37 L27 34"/>
      </svg>
      <span class="brand__name">Healthy<b>Wolf</b></span>
    </a>
    <span class="lang">
      <a href="/test/result/">RU</a>
      <a href="/en/test/result/" aria-current="true">EN</a>
    </span>
  </div>
</header>

<main class="funnel">
  <section>
    <div class="wrap" style="max-width:720px">

      <div class="result__stamps" id="r-stamps"></div>

      <div class="mono" id="r-eyebrow"></div>
      <div class="result__type" id="r-type"></div>
      <div class="result__form" id="r-form"></div>
      <p class="result__gist" id="r-gist"></p>

      <!-- FIG. 01 — LADDER -->
      <div style="margin-top:44px">
        <div class="fig-label" id="r-fig1"></div>
        <div class="ladder" id="r-ladder"></div>
        <p class="muted" id="r-laddernote" style="margin-top:14px;font-size:14px"></p>
      </div>

      <!-- FIG. 02 — QUADRANT -->
      <div style="margin-top:44px">
        <div class="fig-label" id="r-fig2"></div>
        <div class="quad" style="max-width:420px">
          <div class="quad__head">
            <span class="mono sm">Your point</span>
            <span class="mono sm">PANAS · usually</span>
          </div>
          <div class="quad__plotwrap">
            <span class="quad__axis-y" id="r-axisy"></span>
            <div class="quad__plot">
              <svg class="quad__svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                <rect x="0.4" y="0.4" width="99.2" height="99.2" fill="none" stroke="#C7C1B2" stroke-width="0.5"/>
                <line x1="50" y1="0" x2="50" y2="100" stroke="#C7C1B2" stroke-width="0.5"/>
                <line x1="0" y1="50" x2="100" y2="50" stroke="#C7C1B2" stroke-width="0.5"/>
              </svg>
              <div class="quad__label tl">Anxiety</div>
              <div class="quad__label tr">Stress</div>
              <div class="quad__label bl">Apathy</div>
              <div class="quad__label br">Energy</div>
              <span class="quad__pt" id="r-quadpt" style="left:50%;bottom:50%"></span>
            </div>
            <span class="quad__axis-x" id="r-axisx"></span>
          </div>
        </div>
      </div>

      <!-- TABLE 01 — SCORES -->
      <div style="margin-top:44px">
        <div class="fig-label" id="r-tab1"></div>
        <table class="scoretable" id="r-scoretable"></table>
        <p class="scoretable__note" id="r-tablenote"></p>
      </div>

      <!-- BREAKDOWN A–D behind email gate -->
      <div style="margin-top:52px">
        <div class="gate" id="r-gate">
          <span class="stamp gate__lockbadge" id="r-gatelocked"></span>

          <div class="gate__card">
            <h3 id="r-gatetitle"></h3>
            <p id="r-gatesub"></p>
            <!-- SYSTEME_IO_EMBED -->
            <form class="gate__form" id="r-gateform" novalidate>
              <input type="email" id="r-email" autocomplete="email" required>
              <button type="submit" class="btn btn--accent btn--block" id="r-gatebtn"></button>
            </form>
            <div class="gate__ok" id="r-gateok"></div>
          </div>

          <div class="gate__done" id="r-gatedone"></div>

          <div class="gate__locked breakdown">
            <div class="sec">
              <h3 id="r-headA"></h3>
              <p id="r-a1"></p>
              <p id="r-a2"></p>
            </div>
            <div class="sec">
              <h3 id="r-headB"></h3>
              <p id="r-b"></p>
            </div>
            <div class="sec">
              <h3 id="r-headC"></h3>
              <div class="step-list" id="r-steps"></div>
            </div>
            <div class="sec">
              <h3 id="r-headD"></h3>
              <div class="compare" id="r-compare"></div>
              <p id="r-dbody" class="muted"></p>
            </div>
          </div>
        </div>
      </div>

      <div class="result__actions">
        <button type="button" class="btn" id="r-share"></button>
        <button type="button" class="btn btn--ghost" id="r-retake"></button>
      </div>

    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer__in">
    <div class="footer__brand">HealthyWolf · Body · Mind · World</div>
    <div class="footer__legal">
      <a href="/en/privacy/">Privacy Policy</a>
      <a href="/en/terms/">Terms of Use</a>
    </div>
  </div>
</footer>

<script src="/assets/hw.js" defer></script>
</body>
</html>
