<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthyWolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#3E4A40;
  --bg-2:#46534A;
  --cream:#EDE9DE;
  --cream-soft:rgba(237,233,222,.66);
  --cream-faint:rgba(237,233,222,.34);
  --gold:#C6A96B;
  --hair:rgba(237,233,222,.16);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Spline Sans Mono',monospace;background:var(--bg);color:var(--cream);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;background-image:radial-gradient(130% 90% at 50% 8%,var(--bg-2),transparent 55%);}
.mono{font-family:'Spline Sans Mono',monospace;letter-spacing:.14em;text-transform:uppercase;}
.wrap{max-width:1180px;margin:0 auto;padding:0 44px;}

/* top bar */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:26px 0;}
.mark{width:104px;height:104px;display:flex;align-items:center;justify-content:center;color:var(--cream);}
.mark img{width:100%;height:100%;object-fit:contain;}
.mark svg{width:60px;height:60px;}
.top .center{justify-self:center;display:flex;align-items:center;gap:14px;color:var(--cream-soft);font-size:12px;}
.top .center .num{width:34px;height:34px;border:1px solid var(--hair);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;}
.langs{justify-self:end;display:flex;gap:16px;}
.langs button{font-family:'Spline Sans Mono';font-size:12px;letter-spacing:.14em;border:none;background:none;color:var(--cream-faint);cursor:pointer;padding:4px 0;transition:color .2s;}
.langs button.on{color:var(--cream);}

/* hero */
.hero{text-align:center;padding:64px 0 60px;}
.brandbig{font-family:'Fraunces';font-weight:300;font-size:clamp(52px,10vw,150px);line-height:.9;letter-spacing:-.03em;}
.brandbig .w2{color:var(--cream);font-style:italic;font-weight:400;}
.tagline{margin-top:40px;color:var(--cream-soft);letter-spacing:.28em;font-size:clamp(14px,1.7vw,18px);}
.hook{margin:44px auto 0;max-width:18em;font-family:'Fraunces';font-style:italic;font-weight:300;font-size:clamp(30px,4.6vw,56px);line-height:1.2;color:var(--cream);letter-spacing:-.015em;}
.hook em{color:var(--gold);font-style:italic;}

/* quote frame */
.frame{margin:60px 0 0;min-height:200px;border-radius:6px;background:linear-gradient(160deg,rgba(198,169,107,.20),rgba(237,233,222,.08) 55%,rgba(62,74,64,.18));border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;padding:48px 40px;}
.frame p{font-family:'Fraunces';font-style:italic;font-weight:300;font-size:clamp(22px,3vw,38px);line-height:1.32;letter-spacing:-.01em;max-width:20em;text-align:center;}
.frame p b{font-style:normal;font-weight:400;color:var(--gold);}

/* systems */
.systems{padding:96px 0 110px;}
.sys-top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--hair);padding-bottom:18px;margin-bottom:6px;gap:16px;}
.sys-top .lbl{color:var(--cream);font-size:13px;}
.sys-top .hint{color:var(--cream-soft);text-transform:none;letter-spacing:0;font-size:14px;text-align:right;}
.item{display:grid;grid-template-columns:60px 1fr 40px;gap:34px;align-items:center;padding:42px 0;border-bottom:1px solid var(--hair);text-decoration:none;color:inherit;transition:padding-left .3s cubic-bezier(.2,.7,.2,1);}
.item:hover{padding-left:12px;}
.item .idx{color:var(--gold);font-size:15px;}
.item h3{font-family:'Fraunces';font-weight:300;font-size:clamp(30px,4vw,46px);letter-spacing:-.02em;line-height:1;margin-bottom:14px;}
.item p{font-family:'Spline Sans Mono';font-size:16px;color:var(--cream-soft);line-height:1.7;max-width:44em;letter-spacing:0;text-transform:none;}
.item .arw{justify-self:end;color:var(--cream);transition:transform .3s ease;}
.item:hover .arw{transform:translateX(6px);}
.cta{margin-top:64px;text-align:center;}
.cta a{text-decoration:none;color:var(--cream);}
.cta .t{font-family:'Fraunces';font-style:italic;font-weight:300;font-size:clamp(28px,3.6vw,42px);border-bottom:1px solid var(--gold);padding-bottom:14px;transition:color .25s ease;}
.cta a:hover .t{color:var(--gold);}
.cta .s{display:block;margin-top:20px;color:var(--cream-soft);font-size:13px;}
.test-banner{margin-top:52px;}
.test-banner a{display:block;text-align:center;border:1px solid var(--gold);border-radius:8px;padding:26px 24px;text-decoration:none;transition:background .2s;}
.test-banner a:hover{background:rgba(198,169,107,.1);}
.test-banner .tb-eyebrow{display:block;font-family:'Spline Sans Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.test-banner .tb-title{font-family:'Fraunces';font-style:italic;font-weight:300;font-size:clamp(22px,4.6vw,32px);line-height:1.2;color:var(--cream);}
.test-banner .tb-title .arw{font-style:normal;color:var(--gold);}

.fade{opacity:0;transform:translateY(16px);animation:up 1s cubic-bezier(.2,.7,.2,1) forwards;}
.d1{animation-delay:.05s;}.d2{animation-delay:.18s;}.d3{animation-delay:.32s;}.d4{animation-delay:.46s;}
@keyframes up{to{opacity:1;transform:none;}}

@media (max-width:760px){
  .wrap{padding:0 22px;}
  .top{grid-template-columns:auto 1fr;padding:20px 0;}
  .top .center{display:none;}
  .mark{width:88px;height:88px;}
  .hero{padding:40px 0 40px;}
  .tagline{font-size:14px;letter-spacing:.2em;}
  .hook{font-size:clamp(28px,8vw,40px);margin-top:34px;}
  .frame{min-height:160px;padding:36px 24px;}
  .frame p{font-size:22px;}
  .item{grid-template-columns:30px 1fr 22px;gap:14px;padding:34px 0;}
  .item h3{font-size:30px;}
  .item p{font-size:16px;line-height:1.7;}
  .sys-top .hint{font-size:12px;}
}
@media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;transform:none;}}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px;}

/* ===== ЭКРАНЫ ТЕСТОВ (тема шаблона) ===== */
:root{--ok:#8FBF9E;--warn:#C6A96B;--bad:#D08B7E;}
.screen{display:none;}
.screen.active{display:block;animation:up .6s cubic-bezier(.2,.7,.2,1);}
#test,#result{max-width:640px;margin:0 auto;padding:6px 22px 70px;min-height:66vh;}
#test.active,#result.active{display:flex;flex-direction:column;}
.back-link{background:none;border:none;color:var(--cream-faint);font-family:'Spline Sans Mono';font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:8px 0;align-self:flex-start;transition:color .2s;}
.back-link:hover{color:var(--cream);}
.progress-wrap{margin:8px 0 18px;}
.progress-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px;}
.progress-meta .stage{font-family:'Spline Sans Mono';font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);}
.progress-meta .count{font-family:'Spline Sans Mono';font-size:12px;color:var(--cream-soft);font-variant-numeric:tabular-nums;}
.progress-bar{height:2px;background:var(--hair);border-radius:2px;overflow:hidden;}
.progress-bar>i{display:block;height:100%;background:var(--gold);transition:width .3s ease;}
.trinity-dots{display:flex;gap:6px;margin-top:10px;}
.trinity-dots i{height:2px;flex:1;background:var(--hair);border-radius:2px;}
.trinity-dots i.done{background:rgba(198,169,107,.5);}
.trinity-dots i.cur{background:var(--gold);}
.q-block{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:40px 0;}
.q-kicker{font-family:'Spline Sans Mono';font-size:13px;color:var(--cream-soft);margin-bottom:18px;}
.q-word{font-family:'Fraunces';font-weight:300;font-size:clamp(32px,8vw,52px);line-height:1.05;letter-spacing:-.02em;color:var(--cream);}
.q-claim{font-family:'Fraunces';font-style:italic;font-weight:300;font-size:clamp(24px,5.5vw,38px);line-height:1.26;letter-spacing:-.01em;color:var(--cream);}
.q-hint{font-family:'Spline Sans Mono';font-size:13px;color:var(--cream-faint);margin-top:18px;}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.scale button{appearance:none;cursor:pointer;font-family:'Fraunces';font-weight:300;background:var(--bg-2);color:var(--cream);border:1px solid var(--hair);border-radius:5px;height:64px;font-size:24px;transition:all .15s;}
.scale button:hover{border-color:var(--gold);}
.scale button.chosen{background:var(--gold);color:var(--bg);border-color:var(--gold);}
.scale-legend{display:flex;justify-content:space-between;margin-top:12px;}
.scale-legend span{font-family:'Spline Sans Mono';font-size:11px;letter-spacing:.03em;color:var(--cream-faint);text-transform:uppercase;}
.verdicts{display:grid;gap:10px;}
.verdicts button{appearance:none;cursor:pointer;font-family:'Spline Sans Mono';text-align:left;background:var(--bg-2);color:var(--cream);border:1px solid var(--hair);border-radius:5px;padding:17px 18px;font-size:14px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:14px;transition:all .15s;}
.verdicts button:hover{border-color:var(--gold);}
.verdicts button .vk{width:9px;height:9px;border-radius:50%;flex:none;}
.verdicts button.chosen{border-color:var(--gold);background:rgba(198,169,107,.12);}
/* результат */
.result-head{margin:10px 0 22px;}
#resultEyebrow{font-family:'Spline Sans Mono';font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
#resultTitle{font-family:'Fraunces';font-weight:300;font-size:clamp(34px,7vw,52px);letter-spacing:-.02em;line-height:1;color:var(--cream);margin-top:8px;}
.card{background:var(--bg-2);border:1px solid var(--hair);border-radius:6px;padding:22px;margin-bottom:14px;}
.eyebrow{font-family:'Spline Sans Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
.verdict-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.verdict-title .badge2{font-family:'Spline Sans Mono';font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);}
.big-verdict{font-family:'Fraunces';font-weight:300;font-size:clamp(28px,6vw,40px);margin:8px 0;letter-spacing:-.01em;line-height:1.1;color:var(--cream);}
.verdict-desc{font-family:'Spline Sans Mono';color:var(--cream-soft);font-size:14px;line-height:1.7;}
.chart-wrap svg{width:100%;height:auto;display:block;}
.legend-dots{display:flex;gap:18px;justify-content:center;margin-top:10px;}
.legend-dots span{display:inline-flex;align-items:center;gap:7px;font-family:'Spline Sans Mono';font-size:12px;color:var(--cream-soft);text-transform:uppercase;letter-spacing:.03em;}
.legend-dots i{width:11px;height:11px;border-radius:50%;display:inline-block;}
.scores{display:flex;gap:18px;margin-top:16px;}
.score{flex:1;}
.score .k{font-family:'Spline Sans Mono';font-size:11px;color:var(--cream-faint);text-transform:uppercase;letter-spacing:.05em;}
.score .v{font-family:'Fraunces';font-size:28px;font-weight:300;color:var(--cream);font-variant-numeric:tabular-nums;margin-top:2px;}
.bars{display:grid;gap:14px;margin-top:10px;}
.bar-row .bar-top{display:flex;justify-content:space-between;margin-bottom:7px;font-family:'Spline Sans Mono';font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--cream);}
.bar-row .bar-top span{color:var(--cream-soft);font-variant-numeric:tabular-nums;}
.bar-track{height:6px;background:var(--hair);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;background:var(--gold);transition:width .5s ease;}
.bar-fill.low{background:#C08A5E;}.bar-fill.mid{background:#C6A96B;}
.review{display:grid;gap:14px;margin-top:6px;}
.review-item{display:flex;gap:12px;align-items:flex-start;}
.review-item .rk{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:none;}
.review-item .rk.right{background:#8FBF9E;}.review-item .rk.wrong{background:#D08B7E;}
.review-item .rt{font-family:'Spline Sans Mono';font-size:14px;line-height:1.6;}
.review-item .rt .claim{color:var(--cream);}
.review-item .rt .expl{color:var(--cream-soft);font-size:13px;margin-top:3px;}
.review-item .rt .verd{color:var(--gold);}
.next-card{background:linear-gradient(160deg,rgba(198,169,107,.15),rgba(237,233,222,.04));border:1px solid rgba(198,169,107,.32);}
.next-card h3{font-family:'Spline Sans Mono';font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.next-card p{font-family:'Fraunces';font-style:italic;font-weight:300;font-size:20px;line-height:1.42;color:var(--cream);}
.synth-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:6px;}
.synth-cell{background:var(--bg);border:1px solid var(--hair);border-radius:6px;padding:16px;text-align:center;}
.synth-cell .sc-name{font-family:'Spline Sans Mono';font-size:11px;color:var(--cream-faint);text-transform:uppercase;letter-spacing:.05em;}
.synth-cell .sc-val{font-family:'Fraunces';font-weight:300;font-size:22px;margin-top:5px;color:var(--cream);letter-spacing:-.01em;}
@media(max-width:400px){.synth-grid{grid-template-columns:1fr;}}
.email-card h3{font-family:'Fraunces';font-weight:300;font-size:26px;color:var(--cream);margin-bottom:8px;letter-spacing:-.01em;}
.email-card p{font-family:'Spline Sans Mono';color:var(--cream-soft);font-size:13px;line-height:1.6;margin-bottom:16px;}
.email-form{display:flex;flex-direction:column;gap:10px;}
.email-form input{font-family:'Spline Sans Mono';font-size:16px;background:var(--bg);color:var(--cream);border:1px solid var(--hair);border-radius:5px;padding:15px 16px;width:100%;}
.email-form input:focus{outline:none;border-color:var(--gold);}
.email-note{font-family:'Spline Sans Mono';font-size:12px;margin-top:10px;min-height:16px;}
.email-note.ok{color:var(--gold);}.email-note.err{color:#D08B7E;}
.btn{appearance:none;border:none;cursor:pointer;background:var(--gold);color:var(--bg);font-family:'Spline Sans Mono';font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:16px 20px;border-radius:5px;width:100%;min-height:52px;transition:opacity .2s;}
.btn:hover{opacity:.9;}
.btn.secondary{background:none;color:var(--cream);border:1px solid var(--hair);}
.btn.secondary:hover{border-color:var(--gold);}
.result-actions{display:grid;gap:10px;margin-top:4px;}
#result footer{margin-top:34px;padding-top:20px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:6px;}
#result footer .fbrand{font-family:'Spline Sans Mono';font-size:12px;color:var(--cream-soft);}
#result footer .fbrand b{color:var(--gold);}
#result footer .disclaimer{font-family:'Spline Sans Mono';font-size:11px;color:var(--cream-faint);line-height:1.5;}
.item{cursor:pointer;}
.mark{cursor:pointer;}

</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="mark">
      <!-- WOLF LOGO: замени на прозрачный PNG. Назови файл wolf.png и положи рядом -->
      <img src="wolf.png" alt="HealthyWolf" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
      <svg style="display:none" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"><path d="M28 40 Q19 23 25 12 Q34 21 43 21 L57 21 Q66 21 75 12 Q81 23 72 40 Q81 55 72 71 L50 88 L28 71 Q19 55 28 40 Z"/><path d="M37 47 Q43 43 48 48"/><path d="M63 47 Q57 43 52 48"/><path d="M50 60 L44 69 Q50 74 56 69 Z"/></svg>
    </div>
    <div class="center mono"><span class="num">01</span><span data-t="home">Начало</span></div>
    <div class="langs mono"><button data-lang="ru" class="on">RU</button><button data-lang="ro">RO</button><button data-lang="en">EN</button></div>
  </div>
</div>

<div id="home" class="screen active">
<div class="wrap">
  <section class="hero">
    <div class="brandbig fade d1">Healthy<span class="w2">Wolf</span></div>
    <div class="tagline mono fade d2" data-t="tag">Тело · Психика · Мир</div>
    <p class="hook fade d3" data-t="hook"></p>
    <div class="frame fade d4"><p data-t="frameQuote"></p></div>
    <div class="test-banner fade d4">
      <a href="/test/">
        <span class="tb-eyebrow" data-t="testCtaSub"></span>
        <span class="tb-title"><span data-t="testCta"></span> <span class="arw">→</span></span>
      </a>
    </div>
  </section>
</div>

<div class="wrap">
  <section class="systems">
    <div class="sys-top">
      <div class="mono lbl" data-t="sysLabel">Три системы</div>
      <div class="hint" data-t="sysHint">Выбери одну или пройди всё</div>
    </div>
    <a href="#" class="item" data-test="body"><div class="idx">01</div><div><h3 data-t="c1t">Тело</h3><p data-t="c1p"></p></div><svg class="arw" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <a href="#" class="item" data-test="psyche"><div class="idx">02</div><div><h3 data-t="c2t">Психика</h3><p data-t="c2p"></p></div><svg class="arw" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <a href="#" class="item" data-test="world"><div class="idx">03</div><div><h3 data-t="c3t">Мир</h3><p data-t="c3p"></p></div><svg class="arw" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <div class="cta"><a href="#"><span class="t" data-t="ctaT">Пройти все три</span><span class="s mono" data-t="ctaS">Тело · Психика · Мир — ~10 минут</span></a></div>
  </section>
</div>
</div>
<section class="screen" id="test">
  <button class="back-link" id="backBtn" data-i18n="ui.back"></button>
  <div class="progress-wrap">
    <div class="progress-meta"><span class="stage" id="stageLabel"></span><span class="count" id="countLabel"></span></div>
    <div class="progress-bar"><i id="progressFill" style="width:0%"></i></div>
    <div class="trinity-dots" id="trinityDots" style="display:none"></div>
  </div>
  <div class="q-block">
    <div class="q-kicker" id="qKicker"></div>
    <div id="qMain"></div>
    <div class="q-hint" id="qHint"></div>
  </div>
  <div id="qInput"></div>
</section>
<section class="screen" id="result">
  <div class="result-head">
    <div class="eyebrow" id="resultEyebrow"></div>
    <h2 id="resultTitle"></h2>
  </div>
  <div id="resultBody"></div>
  <div class="card email-card">
    <h3 data-i18n="ui.emailTitle"></h3>
    <p data-i18n="ui.emailSub"></p>
    <form class="email-form" id="emailForm" novalidate>
      <input type="email" id="emailInput" data-i18n-attr="placeholder:ui.emailPlaceholder" autocomplete="email" inputmode="email">
      <button class="btn" type="submit" data-i18n="ui.emailBtn"></button>
    </form>
    <div class="email-note" id="emailNote"></div>
  </div>
  <div class="result-actions"><button class="btn secondary" id="moreBtn" data-i18n="ui.moreTests"></button></div>
  <footer>
    <div class="fbrand" data-i18n-html="ui.footerBrand"></div>
    <div class="disclaimer" data-i18n="ui.disclaimer"></div>
  </footer>
</section>

<script>

/* =========================================================================
   1. TI18N — все строки. ru — источник структуры; ro и en повторяют ключи.
      Доступ по «пути»: t("ui.heroTitle"), t("body.tips.sleep") и т.д.
   ========================================================================= */
const TI18N = {

  /* ============================ РУССКИЙ ============================ */
  ru: {
    ui: {
      eyebrow: "Базовая настройка человека",
      heroTitle: "Через 5 минут ты поймёшь, что с тобой — <span class='hl'>и что делать дальше</span>.",
      heroLead: "Не верь на слово. Пройди — и убедись сам. Тело, психика, картина мира — без мусора и без вранья.",
      thesis: "Все продают баночки, страх и веру. Мы даём настройку и уверенность.",

      trinityLabel: "Святая троица",

/* Активный язык — изменяемый. detectLang() выставит реальное значение при старте. */
let LANG = "ru";

// Достаём строку по пути "a.b.c" из текущего языка
function t(path) {
  return path.split(".").reduce((o, k) => (o == null ? o : o[k]), TI18N[LANG]);
}
// Подстановка {i}/{n}
function fmt(str, vars) {
  return String(str).replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : `{${k}}`));
}

/* =========================================================================
   4. Утилиты
   ========================================================================= */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pct01to100(sum, min, max) { return Math.round(((sum - min) / (max - min)) * 100); }
function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()); }

/* =========================================================================
   5. Построение шагов теста (что показываем по одному)
   ========================================================================= */
function buildSteps(testId) {
  if (testId === "body") {
    // перемешиваем, чтобы домены не шли кучей
    return shuffle(BODY.statements).map((s) => ({ testId, type: "scale5", id: s.id, domain: s.domain }));
  }
  if (testId === "psyche") {
    // для каждого замера — свой перемешанный порядок 20 слов
    const steps = [];
    PSYCHE.measures.forEach((measure) => {
      const words = shuffle([
        ...PSYCHE.positive.map((id) => ({ id, polarity: "pos" })),
        ...PSYCHE.negative.map((id) => ({ id, polarity: "neg" })),
      ]);
      words.forEach((w) => steps.push({ testId, type: "scale5", measure, id: w.id, polarity: w.polarity }));
    });
    return steps;
  }
  if (testId === "world") {
    return shuffle(WORLD.claims).map((c) => ({ testId, type: "choice3", id: c.id, answer: c.answer }));
  }
  return [];
}

// Сколько шагов «внутри одного теста» показывать в счётчике (для психики — по замеру)
function localCount(step, steps) {
  if (step.testId === "psyche") {
    const inMeasure = steps.filter((s) => s.measure === step.measure);
    const idx = inMeasure.indexOf(step);
    return { i: idx + 1, n: inMeasure.length };
  }
  const idx = steps.indexOf(step);
  return { i: idx + 1, n: steps.length };
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
  window.scrollTo(0, 0);
}
function activeScreenId() {
  const el = document.querySelector(".screen.active");

}

/* =========================================================================
   7. Запуск теста / очереди
   ========================================================================= */
function startSession(queue, combined) {
  STATE.queue = queue;
  STATE.combined = combined;
  STATE.testIndex = 0;
  // сброс ответов на новый прогон
  STATE.answers = { body: {}, psyche: { now: {}, general: {} }, world: {} };
  startCurrentTest();
  showScreen("test");
}
function startCurrentTest() {
  STATE.steps = buildSteps(STATE.queue[STATE.testIndex]);
  STATE.stepIndex = 0;
  renderStep();
}

/* =========================================================================
   8. Рендер текущего шага
   ========================================================================= */
const qInputEl = document.getElementById("qInput");

function renderStep() {
  const step = STATE.steps[STATE.stepIndex];
  const testId = step.testId;

  // --- прогресс ---
  const { i, n } = localCount(step, STATE.steps);
  document.getElementById("countLabel").textContent = fmt(t("ui.count"), { i, n });
  document.getElementById("progressFill").style.width = (i / n) * 100 + "%";

  // подпись стадии
  let stage;
  if (testId === "psyche") {
    stage = step.measure === "now" ? t("psyche.stageNow") : t("psyche.stageGeneral");
  } else {
    stage = t(testId + ".title");
  }
  document.getElementById("stageLabel").textContent = stage;

  // точки прогресса троицы
  const dotsEl = document.getElementById("trinityDots");
  if (STATE.combined) {
    dotsEl.style.display = "flex";
    dotsEl.innerHTML = STATE.queue.map((_, k) => {
      const cls = k < STATE.testIndex ? "done" : (k === STATE.testIndex ? "cur" : "");
      return `<i class="${cls}"></i>`;
    }).join("");
  } else {
    dotsEl.style.display = "none";
  }

  // --- вопрос ---
  const kicker = document.getElementById("qKicker");
  const main = document.getElementById("qMain");
  const hint = document.getElementById("qHint");

  if (step.type === "scale5") {
    if (testId === "psyche") {
      kicker.textContent = step.measure === "now" ? t("psyche.qNow") : t("psyche.qGeneral");
      main.innerHTML = `<div class="q-word">${t("psyche.words." + step.id)}</div>`;
      hint.textContent = t("psyche.hint");
      renderScale(testId, step);
    } else { // body
      kicker.textContent = t("body.kicker");
      main.innerHTML = `<div class="q-word">${t("body.statements." + step.id)}</div>`;
      hint.textContent = t("body.hint");
      renderScale(testId, step);
    }
  } else if (step.type === "choice3") {
    kicker.textContent = t("world.kicker");
    main.innerHTML = `<div class="q-claim">«${t("world.claims." + step.id + ".text")}»</div>`;
    hint.textContent = t("world.hint");
    renderVerdicts(step);
  }
}

// Шкала 1–5
function renderScale(testId, step) {
  const legendLow = t(testId + ".scaleLow");
  const legendHigh = t(testId + ".scaleHigh");
  const prev = testId === "psyche"
    ? STATE.answers.psyche[step.measure][step.id]
    : STATE.answers.body[step.id];

  let html = '<div class="scale">';
  for (let v = SCALE_MIN; v <= SCALE_MAX; v++) {
    html += `<button type="button" data-v="${v}" class="${prev === v ? "chosen" : ""}">${v}</button>`;
  }
  html += `</div><div class="scale-legend"><span>${legendLow}</span><span>${legendHigh}</span></div>`;
  qInputEl.innerHTML = html;

  qInputEl.querySelectorAll(".scale button").forEach((b) =>
    b.addEventListener("click", () => {
      const v = Number(b.dataset.v);
      if (testId === "psyche") STATE.answers.psyche[step.measure][step.id] = v;
      else STATE.answers.body[step.id] = v;
      b.classList.add("chosen");
      setTimeout(advance, 150);
    })
  );
}

// Вердикты правда/спорно/миф
function renderVerdicts(step) {
  const prev = STATE.answers.world[step.id];
  let html = '<div class="verdicts">';
  WORLD.verdictOrder.forEach((v) => {
    html += `<button type="button" data-v="${v}" class="${prev === v ? "chosen" : ""}">
      <span class="vk" style="background:${VERDICT_COLOR[v]}"></span>${t("world.verdicts." + v)}
    </button>`;
  });
  html += "</div>";
  qInputEl.innerHTML = html;

  qInputEl.querySelectorAll(".verdicts button").forEach((b) =>
    b.addEventListener("click", () => {
      STATE.answers.world[step.id] = b.dataset.v;
      qInputEl.querySelectorAll(".verdicts button").forEach((x) => x.classList.remove("chosen"));
      b.classList.add("chosen");
      setTimeout(advance, 180);
    })
  );
}

/* =========================================================================
   9. Переходы вперёд/назад
   ========================================================================= */
function advance() {
  if (STATE.stepIndex < STATE.steps.length - 1) {
    STATE.stepIndex++;
    renderStep();
  } else {
    finishCurrentTest();
  }
}
function goBack() {
  if (STATE.stepIndex > 0) {
    STATE.stepIndex--;
    renderStep();
  } else if (STATE.combined && STATE.testIndex > 0) {
    // назад в конец предыдущего теста
    STATE.testIndex--;
    STATE.steps = buildSteps(STATE.queue[STATE.testIndex]);
    STATE.stepIndex = STATE.steps.length - 1;
    renderStep();
  } else {
    showScreen("home");
  }
}
function finishCurrentTest() {
  if (STATE.combined && STATE.testIndex < STATE.queue.length - 1) {
    STATE.testIndex++;
    startCurrentTest();
  } else if (STATE.combined) {
    renderCombinedResult();
    showScreen("result");
  } else {
    renderSingleResult(STATE.queue[STATE.testIndex]);
    showScreen("result");
  }
}

// --- ТЕЛО ---
function computeBody() {
  const perDomain = {};
  BODY.domainOrder.forEach((d) => (perDomain[d] = []));
  BODY.statements.forEach((s) => {
    const v = STATE.answers.body[s.id] || 0;
    perDomain[s.domain].push(v);
  });
  const domainPct = {};
  BODY.domainOrder.forEach((d) => {
    const vals = perDomain[d];
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length; // 1..5
    domainPct[d] = pct01to100(avg, 1, 5);
  });
  const overall = Math.round(BODY.domainOrder.reduce((a, d) => a + domainPct[d], 0) / BODY.domainOrder.length);
  // слабое звено — минимальный домен
  const weakest = BODY.domainOrder.reduce((min, d) => (domainPct[d] < domainPct[min] ? d : min), BODY.domainOrder[0]);
  const band = overall >= 75 ? "high" : overall >= 50 ? "mid" : "low";
  return { domainPct, overall, weakest, band };
}

// --- ПСИХИКА ---
function computePsyche() {
  const one = (measure) => {
    const a = STATE.answers.psyche[measure];
    const pa = PSYCHE.positive.reduce((s, id) => s + (a[id] || 0), 0); // 10..50
    const na = PSYCHE.negative.reduce((s, id) => s + (a[id] || 0), 0);
    const { pa: PA_T, na: NA_T } = PSYCHE.thresholds;
    let q;
    if (pa >= PA_T && na < NA_T) q = "drive";
    else if (pa >= PA_T && na >= NA_T) q = "overheat";
    else if (pa < PA_T && na >= NA_T) q = "anxiety";
    else q = "calm";
    return { pa, na, paPct: pct01to100(pa, 10, 50), naPct: pct01to100(na, 10, 50), quadrant: q };
  };
  return { now: one("now"), general: one("general") };
}
function psycheRough(q) { return q === "anxiety" || q === "overheat"; }
function psycheGapKey(now, general) {
  const dPA = now.paPct - general.paPct;
  const dNA = now.naPct - general.naPct;
  const worseNow = dPA <= -15 || dNA >= 15;
  const betterNow = dPA >= 15 || dNA <= -15;
  const close = Math.abs(dPA) < 12 && Math.abs(dNA) < 12;
  let key;
  if (worseNow && !psycheRough(general.quadrant)) key = "gapDip";
  else if (psycheRough(general.quadrant)) key = "gapBase";
  else if (betterNow) key = "gapUp";
  else key = "gapHonest";
  if (close && !psycheRough(general.quadrant)) key = "gapHonest";
  return key;
}

// --- МИР ---
function computeWorld() {
  let correct = 0;
  const review = WORLD.claims.map((c) => {
    const your = STATE.answers.world[c.id];
    const ok = your === c.answer;
    if (ok) correct++;
    return { id: c.id, your, answer: c.answer, ok };
  });
  const pctv = Math.round((correct / WORLD.claims.length) * 100);
  const band = pctv >= 87 ? "high" : pctv >= 62 ? "mid" : "low";
  return { correct, total: WORLD.claims.length, pct: pctv, band, review };
}

// Карта-квадрант психики (SVG). X — позитивная энергия, Y — напряжение (вверх).
function psycheChartSVG(now, general) {
  const W = 320, H = 320, pad = 34;
  const plot = { x0: pad, y0: H - pad, w: W - pad * 2, h: H - pad * 2 };
  const px = (p) => plot.x0 + (p / 100) * plot.w;
  const py = (p) => plot.y0 - (p / 100) * plot.h;
  const thrX = px(pct01to100(PSYCHE.thresholds.pa, 10, 50));
  const thrY = py(pct01to100(PSYCHE.thresholds.na, 10, 50));
  const nx = px(now.paPct), ny = py(now.naPct);
  const gx = px(general.paPct), gy = py(general.naPct);
  const q = t("psyche.quadrants");
  // Цвета под светлую тему (карта на белой карточке)
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("psyche.title")}">
    <rect x="${plot.x0}" y="${plot.y0 - plot.h}" width="${plot.w}" height="${plot.h}" fill="rgba(237,233,222,0.04)" stroke="rgba(237,233,222,0.20)" rx="6"/>
    <line x1="${thrX}" y1="${plot.y0 - plot.h}" x2="${thrX}" y2="${plot.y0}" stroke="rgba(237,233,222,0.20)" stroke-dasharray="4 4"/>
    <line x1="${plot.x0}" y1="${thrY}" x2="${plot.x0 + plot.w}" y2="${thrY}" stroke="rgba(237,233,222,0.20)" stroke-dasharray="4 4"/>
    <text x="${plot.x0 + 6}" y="${plot.y0 - plot.h + 16}" fill="#BEB9AB" font-size="10">${q.anxiety}</text>
    <text x="${plot.x0 + plot.w - 6}" y="${plot.y0 - plot.h + 16}" fill="#BEB9AB" font-size="10" text-anchor="end">${q.overheat}</text>
    <text x="${plot.x0 + 6}" y="${plot.y0 - 8}" fill="#BEB9AB" font-size="10">${q.calm}</text>
    <text x="${plot.x0 + plot.w - 6}" y="${plot.y0 - 8}" fill="#BEB9AB" font-size="10" text-anchor="end">${q.drive}</text>
    <text x="${plot.x0 + plot.w / 2}" y="${H - 8}" fill="#8E8A7C" font-size="10" text-anchor="middle">${t("psyche.axisEnergy")}</text>
    <text x="12" y="${plot.y0 - plot.h / 2}" fill="#8E8A7C" font-size="10" text-anchor="middle" transform="rotate(-90 12 ${plot.y0 - plot.h / 2})">${t("psyche.axisTension")}</text>
    <line x1="${nx}" y1="${ny}" x2="${gx}" y2="${gy}" stroke="#EDE9DE" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3"/>
    <circle cx="${gx}" cy="${gy}" r="7" fill="#3E4A40" stroke="#EDE9DE" stroke-width="2"/>
    <circle cx="${nx}" cy="${ny}" r="7" fill="#C6A96B" stroke="#3E4A40" stroke-width="2"/>
  </svg>`;
}

function currentResultSnapshot() {
  const snap = {};
  const ran = new Set(STATE.queue);
  if (ran.has("body")) snap.body = computeBody();
  if (ran.has("psyche")) snap.psyche = computePsyche();
  if (ran.has("world")) snap.world = computeWorld();
  return snap;
}
function saveEmail(email) {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(CONFIG.storageKey)) || []; } catch (e) { list = []; }
  if (list.some((r) => r.email === email)) return "dup";
  list.push({
    email,
    lang: LANG,
    tests: STATE.queue.slice(),
    result: currentResultSnapshot(),
    ts: new Date().toISOString(),
  });
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(list)); } catch (e) {}
  return "ok";
}
function resetEmailNote() {
  const note = document.getElementById("emailNote");
  note.textContent = "";
  note.className = "email-note";
}
// Web3Forms — заявки приходят на почту владельца (ключ публичный по дизайну сервиса)
const WEB3FORMS_KEY = "41b4a298-0a04-4abf-ba4a-28c3770ebb61";
function submitLead(email) {
  const snap = currentResultSnapshot();
  let summary = "Заявка с myhealthywolf.com\n";
  summary += "Тесты: " + (STATE.queue.join(", ") || "—") + "\n";
  summary += "Язык: " + LANG + "\n";
  if (snap.body)   summary += "Тело: " + snap.body.overall + "% (слабое звено: " + snap.body.weakest + ")\n";
  if (snap.psyche) summary += "Психика: сейчас=" + snap.psyche.now.quadrant + " / обычно=" + snap.psyche.general.quadrant + "\n";
  if (snap.world)  summary += "Мир: " + snap.world.pct + "% (" + snap.world.correct + "/" + snap.world.total + ")\n";
  // FormData -> «простой» запрос без CORS-preflight (надёжнее всего для Web3Forms)
  const fd = new FormData();
  fd.append("access_key", WEB3FORMS_KEY);
  fd.append("subject", "HealthyWolf — новая заявка на разбор");
  fd.append("from_name", "HealthyWolf");
  fd.append("email", email);   // почта посетителя (reply-to)
  fd.append("message", summary);
  return fetch("https://api.web3forms.com/submit", { method: "POST", body: fd });
}
function onEmailSubmit(e) {
  e.preventDefault();
  const input = document.getElementById("emailInput");
  const note = document.getElementById("emailNote");
  const email = input.value.trim();
  if (!isValidEmail(email)) {
    note.textContent = t("ui.emailErr");
    note.className = "email-note err";
    return;
  }
  const res = saveEmail(email);            // локальный бэкап
  if (res !== "dup") {
    submitLead(email).catch(() => {});     // отправка владельцу на почту
    input.value = "";
  }
  note.textContent = res === "dup" ? t("ui.emailDup") : t("ui.emailOk");
  note.className = "email-note ok";
}
